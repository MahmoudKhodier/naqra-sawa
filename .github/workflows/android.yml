# Builds the Android app (Capacitor shell around site/) and publishes it as
#   https://github.com/<owner>/<repo>/releases/download/android-latest/naqra-sawa.apk
# Signed with the release keystore when the four ANDROID_* secrets exist (see docs/ANDROID.md),
# otherwise with an app key created once and kept in the Actions cache.
name: android

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-sw.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # create/update the android-latest release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 / AGP 8.13 compile with Java 21
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build service worker precache list
        run: npm run build:sw

      - name: Copy the web app and plugins into the Android project
        run: npx cap sync android

      - name: Prepare signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "source=secrets" >> "$GITHUB_OUTPUT"
          else
            echo "source=cache" >> "$GITHUB_OUTPUT"
          fi

      # Without the release secrets: one app signing key, created by the first build and kept in the Actions
      # cache (keep-signing-key.yml touches it every 3 days so GitHub never drops it). Every APK is signed with
      # it, so each build installs as an update of the last one, from the app or by hand.
      - name: Restore the cached app signing key
        if: steps.signing.outputs.source == 'cache'
        uses: actions/cache@v4
        with:
          path: ~/.naqra-signing
          key: naqra-signing-v1

      - name: Create the app signing key (first build only)
        if: steps.signing.outputs.source == 'cache'
        run: |
          mkdir -p ~/.naqra-signing
          if [ ! -f ~/.naqra-signing/app.p12 ]; then
            keytool -genkeypair -keystore ~/.naqra-signing/app.p12 -storetype PKCS12 -alias naqra -keyalg RSA -keysize 2048 -validity 20000 \
              -storepass naqra-sawa-app -keypass naqra-sawa-app -dname "CN=Naqra Sawa, O=Naqra Sawa, C=EG"
            echo "::notice title=New app signing key::Created the app signing key. Phones with an APK signed by an older key must reinstall once."
          fi

      - name: Build APK
        working-directory: android
        env:
          SOURCE: ${{ steps.signing.outputs.source }}
          SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ "$SOURCE" = "secrets" ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ANDROID_KEYSTORE_PASSWORD="$SECRET_STORE_PASSWORD" ANDROID_KEY_ALIAS="$SECRET_KEY_ALIAS" ANDROID_KEY_PASSWORD="$SECRET_KEY_PASSWORD"
          else
            export ANDROID_KEYSTORE_FILE="$HOME/.naqra-signing/app.p12" ANDROID_KEYSTORE_PASSWORD=naqra-sawa-app ANDROID_KEY_ALIAS=naqra ANDROID_KEY_PASSWORD=naqra-sawa-app
          fi
          ./gradlew --no-daemon assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/naqra-sawa.apk"
          # The signing certificate's fingerprint goes into the release notes: it must stay the same from build to build.
          keytool -list -v -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' > "$RUNNER_TEMP/cert-sha256.txt"
          ls -l "$RUNNER_TEMP/out"; cat "$RUNNER_TEMP/cert-sha256.txt"

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: naqra-sawa-apk
          path: ${{ runner.temp }}/out/naqra-sawa.apk
          if-no-files-found: error

      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.signing.outputs.source }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag=android-latest
          apk="$RUNNER_TEMP/out/naqra-sawa.apk"
          kind=$([ "$SOURCE" = "secrets" ] && echo "release keystore" || echo "app key from the build cache")
          cert=$(cat "$RUNNER_TEMP/cert-sha256.txt" 2>/dev/null || true)
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "## نقرأ سوا لأندرويد — نسخة رقم $BUILD"
            echo
            echo "نزّل الملف **naqra-sawa.apk** من تحت وافتحه على موبايلك. لو أول مرة، اسمح بتثبيت التطبيقات من المصدر ده."
            echo "للتحديث: نزّل نفس الملف تاني وثبّته فوق القديم."
            echo
            echo "Android build $BUILD ($kind) from commit ${GITHUB_SHA::7}."
            echo "Signing certificate SHA-256: $cert"
            echo "Direct link: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/naqra-sawa.apk"
          } > "$notes"
          # Keep the tag on the commit this APK was built from.
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --title "نقرأ سوا — Android (build $BUILD)" --notes-file "$notes"
          else
            gh release create "$tag" "$apk" --title "نقرأ سوا — Android (build $BUILD)" --notes-file "$notes" --latest
          fi
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/naqra-sawa.apk" >> "$GITHUB_STEP_SUMMARY"
